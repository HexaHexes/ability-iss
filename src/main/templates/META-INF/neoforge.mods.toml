# Mod metadata file. Values written in dollar-brace form are replaced at build
# time from gradle.properties (see generateModMetadata in build.gradle), so mod
# identity is edited in one place only.
# See https://docs.neoforged.net/docs/concepts/modfiles/ for the full schema.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[modproperties.${mod_id}]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
type = "required"
versionRange = "[9.0.5+1.21.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "irons_spellbooks"
type = "required"
# ISS versions carry the Minecraft prefix (1.21.1-3.16.3): a bare 3.16.3
# floor would order above the real version and reject it.
versionRange = "[1.21.1-3.16.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ability_core"
type = "required"
# alpha.40 is both the floor and the gate: this mod CONSUMES the slot
# gate (ActivationRequests.requireSlot, ability-core#87) that shipped
# there, so older cores are not merely untested but missing an API the
# cast handler calls. The floor's history in one line: the resource
# series reshaped AbilityDefinition's canonical constructor at alpha.34
# (costs), 35 (strategy) and 39 (amount resolver) - each break crashed
# older binaries at RegisterEvent (Tensura RPG, 2026-11-06) - so a floor
# cannot defend against pre-1.0 breaks inside its range: compile against
# what the pack runs, gate, re-pin with the fleet.
versionRange = "[1.0.0-alpha.40,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ability_hotbar"
type = "required"
# alpha.92: the oldest hotbar carrying the spell-tab API this mod's
# Spells tab consumes (TabContent handlers, informational tabs,
# registerCategoryTabs, subCategoryIcon) - older ones never register
# the tab's shape or its chip icons.
versionRange = "[1.0.0-alpha.92,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tensura"
type = "optional"
# The HUD swap's subject (owner: replace Tensura's charging row with
# ISS's overlays when both ability mods load) - gated behind isLoaded
# in IssClientEvents, so absence no-ops. 2.0.1 = the first line this
# swap reads.
versionRange = "[2.0.1,)"
ordering = "AFTER"
side = "BOTH"

# ManasCore - optional: the Tensura HUD swap reads Tensura's HudConfig
# through ConfigRegistry, but only inside the isLoaded("tensura") gate in
# IssClientEvents, so absence (or ManasCore's absence behind Tensura)
# no-ops the swap.
[[dependencies.${mod_id}]]
modId = "manascore"
type = "optional"
versionRange = "[4.0.0.2,)"
ordering = "AFTER"
side = "BOTH"

# Add your mod's dependencies below. Use type = "optional" for anything the mod
# works without, and gate the code that touches it (mixins, registrations) so it
# no-ops when the dependency is absent.
