# Mod metadata file. Values written in dollar-brace form are replaced at build
# time from gradle.properties (see generateModMetadata in build.gradle), so mod
# identity is edited in one place only.
# See https://docs.neoforged.net/docs/concepts/modfiles/ for the full schema.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[modproperties.${mod_id}]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
type = "required"
versionRange = "[9.0.5+1.21.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "irons_spellbooks"
type = "required"
# ISS versions carry the Minecraft prefix (1.21.1-3.16.3): a bare 3.16.3
# floor would order above the real version and reject it.
versionRange = "[1.21.1-3.16.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ability_core"
type = "required"
# alpha.09 of the 1.1.0 line is the floor: ActivationType.NONE - the
# school mastery rows register with it (a pre-NONE core has no constant
# to reference - NoSuchFieldError at the registry event). Under it sits
# alpha.07 (MasteryEffects.rangeMultiplier, the RANGE seam's read -
# core#148's fifth axis), then the row's live COST quote through
# hotbar's CoreMasteryCompat (alpha.02 - Entry.bonuses ships with the
# channel v5 bump; both sides must run the same channel version or they
# disconnect at negotiation), the mastery contract (1.0.2-alpha.01,
# core#137 - declarations, awards, effect reads) and the slot gate
# (ability-core#87). The floor turns the break history into a boot
# refusal: the resource series reshaped AbilityDefinition's constructor
# at alpha.34/35/39 and each break crashed older binaries at
# RegisterEvent (Tensura RPG, 2026-11-06) - a too-old pack now gets a
# loud dependency error instead. Packs authoring mastery_spec overlays
# want the datapack layer (core#138+).
versionRange = "[1.1.0-alpha.09,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ability_hotbar"
type = "required"
# alpha.13 of the 1.0.1 line is the floor: it carries hotbar's
# slotTooltip hook - this provider's pill hover builds the cell's scroll
# and shows its tooltip, so under it the override never binds. alpha.11
# added the informational-gate NONE/UNKNOWN exemption (their toggle and
# cycle survive under the Spells tab; the pane omits the Activation
# section for NONE) and the slotName hook (the menu's provider pill
# shows each spell's name beside its icon); every API the Spells tab
# consumes is older still (registerBarForTab alpha.99, LiveCosts
# alpha.100, TabContent/informational tabs, registerCategoryTabs,
# subCategoryIcon) along with CoreMasteryCompat.bonusesOf (the row's
# live COST quote reads the snapshot's discount from it) - older
# hotbars never register the tab's shape or show the names.
versionRange = "[1.0.1-alpha.13,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tensura"
type = "optional"
# The HUD swap's subject (owner: replace Tensura's charging row with
# ISS's overlays when both ability mods load) - gated behind isLoaded
# in IssClientEvents, so absence no-ops. 2.0.1 = the first line this
# swap reads.
versionRange = "[2.0.1,)"
ordering = "AFTER"
side = "BOTH"

# ManasCore - optional: the Tensura HUD swap reads Tensura's HudConfig
# through ConfigRegistry, but only inside the isLoaded("tensura") gate in
# IssClientEvents, so absence (or ManasCore's absence behind Tensura)
# no-ops the swap.
[[dependencies.${mod_id}]]
modId = "manascore"
type = "optional"
versionRange = "[4.0.0.2,)"
ordering = "AFTER"
side = "BOTH"

# Add your mod's dependencies below. Use type = "optional" for anything the mod
# works without, and gate the code that touches it (mixins, registrations) so it
# no-ops when the dependency is absent.
