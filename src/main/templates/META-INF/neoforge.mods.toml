# Mod metadata file. Values written in dollar-brace form are replaced at build
# time from gradle.properties (see generateModMetadata in build.gradle), so mod
# identity is edited in one place only.
# See https://docs.neoforged.net/docs/concepts/modfiles/ for the full schema.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[modproperties.${mod_id}]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
type = "required"
versionRange = "[9.0.5+1.21.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "irons_spellbooks"
type = "required"
# ISS versions carry the Minecraft prefix (1.21.1-3.16.3): a bare 3.16.3
# floor would order above the real version and reject it.
versionRange = "[1.21.1-3.16.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ability_core"
type = "required"
# alpha.32 is what this builds and gametests against. Its only breaking
# change since alpha.26 (#91) reshapes ResourceConsumer, which this mod
# never touches - the floor names what we gate on, not a code requirement.
versionRange = "[1.0.0-alpha.32,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ability_hotbar"
type = "required"
# alpha.46 = Provider API v2 (hotbar#118): the state-defaulted selection
# frame this bar's cells frame with, plus the iconId/availabilityFor hooks
# the spell cells consume. alpha.45's one-call registration and seedAll
# ride below that floor; alpha.47 (what we compile against) is docs-only.
versionRange = "[1.0.0-alpha.46,)"
ordering = "AFTER"
side = "BOTH"

# Add your mod's dependencies below. Use type = "optional" for anything the mod
# works without, and gate the code that touches it (mixins, registrations) so it
# no-ops when the dependency is absent.
