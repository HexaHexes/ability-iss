# Mod metadata file. Values written in dollar-brace form are replaced at build
# time from gradle.properties (see generateModMetadata in build.gradle), so mod
# identity is edited in one place only.
# See https://docs.neoforged.net/docs/concepts/modfiles/ for the full schema.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[modproperties.${mod_id}]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
type = "required"
versionRange = "[9.0.5+1.21.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "irons_spellbooks"
type = "required"
# ISS versions carry the Minecraft prefix (1.21.1-3.16.3): a bare 3.16.3
# floor would order above the real version and reject it.
versionRange = "[1.21.1-3.16.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ability_core"
type = "required"
# alpha.40 is both the floor and the gate: this mod CONSUMES the slot
# gate (ActivationRequests.requireSlot, ability-core#87) that shipped
# there, so older cores are not merely untested but missing an API the
# cast handler calls. The floor's history in one line: the resource
# series reshaped AbilityDefinition's canonical constructor at alpha.34
# (costs), 35 (strategy) and 39 (amount resolver) - each break crashed
# older binaries at RegisterEvent (Tensura RPG, 2026-11-06) - so a floor
# cannot defend against pre-1.0 breaks inside its range: compile against
# what the pack runs, gate, re-pin with the fleet.
versionRange = "[1.0.0-alpha.40,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ability_hotbar"
type = "required"
# alpha.49: the oldest hotbar whose renderer works against this mod's
# core floor - 46-48 invoke AbilityDefinition.cost(), removed in core
# alpha.34 (hotbar#122, fixed in 49), so they crash the frame against
# core >= 34. alpha.46 = Provider API v2 (hotbar#118: state-defaulted
# selection frame, iconId, availabilityFor - the hooks this mod's cells
# consume); 49 is also what we compile and gametest against.
versionRange = "[1.0.0-alpha.49,)"
ordering = "AFTER"
side = "BOTH"

# Add your mod's dependencies below. Use type = "optional" for anything the mod
# works without, and gate the code that touches it (mixins, registrations) so it
# no-ops when the dependency is absent.
