# Delegates to the shared workflow suite hosted in ability-core
# (one copy for the whole org). Triggers, permissions and concurrency

name: CodeQL

# CodeQL *advanced setup*: the deterministic engine only, $0 on a public repo.
# Deliberately not GitHub's paid "Code Quality" product, which meters AI credits
# per finding and cannot have its in-PR autofix turned off. It is the `analyze`
# required check; findings live in the Security tab and as PR annotations.
#
# build-mode is manual because moddev's autobuild detection is unreliable on
# NeoForge projects. The step carries PACKAGE_READ_TOKEN so a derived repo
# resolving cross-repo packages still builds on a cold cache.

on:
  pull_request:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '27 4 * * 1'   # weekly; off-the-hour minute avoids the cron rush
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload SARIF results; explicit blocks zero the rest

concurrency:
  # PRs cancel superseded runs of their own number; pushes cancel older runs of
  # the same ref - ci.yml's keying extended to push events.
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    uses: HexaHexes/ability-core/.github/workflows/reusable-codeql.yml@main
    secrets: inherit
